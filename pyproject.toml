[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decompathon-xbox"
version = "0.1.0"
description = "Matching-decompilation tools for original Xbox games: XBE inventory, an MSVC-under-Wine harness, relocation-resolving match gates, a matching workbench and progress reports"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = ["capstone>=5,<6"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
xbx = "xbx.cli:main"

[tool.setuptools]
packages = ["xbx", "xbx.gates", "xbx.workbench"]

[tool.setuptools.package-data]
xbx = ["template/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
